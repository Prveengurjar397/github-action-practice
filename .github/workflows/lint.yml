# What is the goal of your workflow
# Goal : Whenever someone  changes the python code , 
# the litner will check if the sytax, format , indentation (linting) is correct or not
name: Auto Linter

on: 
  push:
    paths: "*.py"
jobs:
  code-linting:
    runs-on: ubuntu-24.04
    steps:
    # this step will automatically clone the code of the current branch into the runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
      # this step will installing python 
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # this step will install the linting tool
      - name: install linter
        run: pip install ruff
        # this step will run the linter
      - name: Check all files for linting
        run: ruff check .
